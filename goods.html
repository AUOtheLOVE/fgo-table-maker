<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>공구 잔여 표시</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f5f0; --s1:#ffffff; --s2:#f0ede8; --s3:#e8e4de; --line:#ddd9d2;
  --t1:#1a1814; --t2:#6b6660; --t3:#aaa49e; --acc:#9a7c2e;
}
body{
  background:var(--bg);color:var(--t1);
  font-family:'Segoe UI','Noto Sans KR',system-ui,sans-serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
  font-size:13px;line-height:1.5;
}
.topbar{background:var(--s1);border-bottom:1px solid var(--line);padding:9px 14px;
  display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;position:relative}
.topbar h1{font-size:14px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.topbar h1 span{color:var(--acc)}
.btn{background:var(--s2);color:var(--t1);border:1px solid var(--line);border-radius:5px;
  padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;transition:background .1s,border-color .1s}
.btn:hover{background:var(--s3);border-color:var(--t3)}
.btn.acc{border-color:var(--acc);color:var(--acc)}
.btn.acc:hover{background:var(--acc);color:#fff}
.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sel-i{background:var(--bg);color:var(--t1);border:1px solid var(--line);border-radius:5px;
  padding:6px 8px;font-size:12px;max-width:190px}
.sep{width:1px;height:18px;background:var(--line);margin:0 2px;flex-shrink:0}
.menu{position:absolute;right:12px;top:46px;background:var(--s1);border:1px solid var(--line);
  border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:4px;display:none;z-index:50;min-width:150px}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;
  padding:8px 12px;font-size:12px;cursor:pointer;color:var(--t1);border-radius:4px}
.menu button:hover{background:var(--s2)}
.menu button.dl{color:#c0392b}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}

.canvas-scroll{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
#stage{position:relative;display:inline-block;line-height:0;box-shadow:0 2px 12px rgba(0,0,0,.12);background:#fff;max-width:100%}
#baseImg{display:block;max-width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
#layer{position:absolute;inset:0;touch-action:pan-x pan-y;cursor:crosshair}
body.placing #layer{cursor:copy}

.mask{position:absolute;background:#fff;cursor:pointer}
.mask:hover{box-shadow:inset 0 0 0 2px rgba(224,80,80,.55)}
.mark{position:absolute;background:#e02020;color:#fff;font-weight:800;
  padding:.08em .3em;border-radius:.16em;font-family:system-ui,sans-serif;
  letter-spacing:-.02em;cursor:move;touch-action:none;white-space:nowrap;
  transform:translate(-50%,-50%);line-height:1.15;box-shadow:0 1px 3px rgba(0,0,0,.25);
  user-select:none}
.mark.sel{outline:3px solid var(--acc);outline-offset:2px}
#rubber{position:absolute;background:rgba(255,255,255,.6);border:2px dashed var(--acc);display:none;pointer-events:none}

.statusbar{background:var(--s1);border-top:1px solid var(--line);padding:6px 14px;font-size:11.5px;color:var(--t2);flex-shrink:0}
.empty{padding:50px 20px;text-align:center;color:var(--t3);line-height:2}
.drop{border:2px dashed var(--line);border-radius:10px;padding:44px 30px;text-align:center;color:var(--t2);background:var(--s1)}
.drop.over{border-color:var(--acc);background:var(--s2)}
@media(max-width:760px){
  .topbar{padding:7px 8px;gap:6px}
  .topbar h1{display:none}
  .canvas-scroll{padding:6px}
  .menu{right:6px;top:44px}
}
</style>
</head>
<body>

<div class="topbar">
  <h1>공구 <span>잔여 표시</span></h1>
  <select class="sel-i" id="projSel" onchange="openProject(this.value)"></select>
  <button class="btn" onclick="newProject()">+ 새 공구</button>
  <div class="sep"></div>
  <button class="btn" id="btnMark" onclick="startPlace()">+ 숫자</button>
  <button class="btn" onclick="scaleMarks(1/1.18)" title="숫자 전체 작게">A−</button>
  <button class="btn" onclick="scaleMarks(1.18)" title="숫자 전체 크게">A+</button>
  <div class="sep"></div>
  <button class="btn" onclick="undo()">되돌리기</button>
  <span style="margin-left:auto"></span>
  <button class="btn acc" onclick="exportPNG()">PNG 저장</button>
  <button class="btn" onclick="toggleMenu(event)">⋯</button>
  <div class="menu" id="menu">
    <button onclick="closeMenu();document.getElementById('imgIn').click()">이미지 교체</button>
    <button onclick="closeMenu();renameProject()">이름 바꾸기</button>
    <hr/>
    <button onclick="closeMenu();exportJSON()">백업 저장</button>
    <button onclick="closeMenu();document.getElementById('jsonIn').click()">백업 불러오기</button>
    <hr/>
    <button onclick="closeMenu();location.href='index.html'">테이블 메이커 →</button>
    <button class="dl" onclick="closeMenu();deleteProject()">이 공구 삭제</button>
  </div>
</div>

<div class="canvas-scroll" id="scroll">
  <div>
    <div class="empty" id="emptyBox">
      <div class="drop" id="drop">
        이미지를 끌어다 놓거나 붙여넣기(Ctrl+V)<br/>
        <button class="btn acc" style="margin-top:14px" onclick="document.getElementById('imgIn').click()">이미지 선택</button>
      </div>
    </div>
    <div id="stage" style="display:none">
      <img id="baseImg" alt=""/>
      <div id="layer"></div>
      <div id="rubber"></div>
    </div>
  </div>
</div>
<div class="statusbar" id="sb">준비</div>

<input type="file" id="imgIn" accept="image/*" style="display:none"/>
<input type="file" id="jsonIn" accept="application/json,.json" style="display:none"/>

<script>
/* ══════════ 상태 ══════════
   masks : [{x,y,w,h}]  0~1 정규화 · 하얗게 가린 영역
   marks : [{x,y,n,fs}] 0~1 정규화 중심 좌표 · +n 표식 (fs = 이미지 너비 대비 글자 크기)
*/
const LS_IDX = 'fgogoods.index';
const LS_P = id => 'fgogoods.p.' + id;
const DEF_SIZE = { w: 0.09, h: 0.16 };
const DEF_FS = 0.026;
const CLICK_PX = 6;

let P = null, img = null;
let undoStack = [];
let placing = false;
let selMark = null;   // 선택된 숫자 표식 index

const $ = id => document.getElementById(id);
const setSb = t => $('sb').textContent = t;
const clamp01 = v => Math.max(0, Math.min(1, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ══════════ IndexedDB ══════════ */
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('fgogoods', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('images');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbPut(k, b) { const db = await idb(); return new Promise((res, rej) => {
  const t = db.transaction('images', 'readwrite'); t.objectStore('images').put(b, k);
  t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => {
  const t = db.transaction('images', 'readonly'); const q = t.objectStore('images').get(k);
  q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbDel(k) { const db = await idb(); return new Promise(res => {
  const t = db.transaction('images', 'readwrite'); t.objectStore('images').delete(k); t.oncomplete = res; }); }

/* ══════════ 프로젝트 ══════════ */
const loadIndex = () => { try { return JSON.parse(localStorage.getItem(LS_IDX)) || []; } catch { return []; } };
const saveIndex = ix => localStorage.setItem(LS_IDX, JSON.stringify(ix));

function renderProjSel() {
  const ix = loadIndex();
  $('projSel').innerHTML = ix.length
    ? ix.map(p => `<option value="${p.id}"${P && p.id === P.id ? ' selected' : ''}>${esc(p.name)}</option>`).join('')
    : '<option value="">(공구 없음)</option>';
}
function blankProject(id, name) {
  return { version: 2, id, name, imgW: 0, imgH: 0, masks: [], marks: [], lastSize: { ...DEF_SIZE }, fs: DEF_FS };
}
/* 구버전(hotspots) → 새 구조 이관 */
function migrate(p) {
  if (!p) return p;
  if (p.version === 2 && p.masks) {
    if (!p.fs) p.fs = (p.marks && p.marks[0] && p.marks[0].fs) || DEF_FS;
    return p;
  }
  const hs = p.hotspots || [];
  const masks = [], marks = [];
  for (const h of hs) {
    const done = h.done !== undefined ? h.done : (h.qty !== undefined ? h.qty <= 0 : false);
    const n = h.n || 0;
    if (done) masks.push({ x: h.x, y: h.y, w: h.w, h: h.h });
    else if (n > 0) marks.push({ x: clamp01(h.x + h.w), y: clamp01(h.y), n });
  }
  const sizes = hs.filter(h => h.w && h.h);
  const med = a => { const s = a.slice().sort((x, y) => x - y); return s[s.length >> 1]; };
  const lastSize = sizes.length ? { w: med(sizes.map(h => h.w)), h: med(sizes.map(h => h.h)) } : { ...DEF_SIZE };
  const fs = (p.marks && p.marks[0] && p.marks[0].fs) || p.fs || DEF_FS;
  return { version: 2, id: p.id, name: p.name, imgW: p.imgW || 0, imgH: p.imgH || 0, masks, marks, lastSize, fs };
}
function newProject() {
  const name = prompt('공구 이름', '공구 ' + new Date().toISOString().slice(5, 10));
  if (name === null) return;
  const id = 'g' + Date.now().toString(36);
  P = blankProject(id, name || '이름없음');
  const ix = loadIndex(); ix.unshift({ id, name: P.name, updatedAt: Date.now() }); saveIndex(ix);
  img = null; undoStack = [];
  save(); renderProjSel(); renderAll();
  setSb('이미지를 올리세요');
}
function renameProject() {
  if (!P) return;
  const n = prompt('공구 이름', P.name); if (n === null) return;
  P.name = n || P.name;
  const ix = loadIndex(); const e = ix.find(x => x.id === P.id); if (e) e.name = P.name;
  saveIndex(ix); save(); renderProjSel();
}
async function deleteProject() {
  if (!P) return;
  if (!confirm(`"${P.name}" 삭제할까요?`)) return;
  localStorage.removeItem(LS_P(P.id)); await idbDel(P.id);
  saveIndex(loadIndex().filter(x => x.id !== P.id));
  P = null; img = null;
  const ix = loadIndex(); renderProjSel();
  if (ix.length) openProject(ix[0].id); else { renderAll(); setSb('공구 없음'); }
}
async function openProject(id) {
  if (!id) return;
  let d; try { d = JSON.parse(localStorage.getItem(LS_P(id))); } catch { d = null; }
  if (!d) { setSb('불러오기 실패'); return; }
  P = migrate(d); undoStack = [];
  const blob = await idbGet(id);
  if (blob) await setImageFromBlob(blob, false); else img = null;
  save(); renderProjSel(); renderAll();
  setSb(`"${P.name}" · 가림 ${P.masks.length} · 숫자 ${P.marks.length}`);
}
let saveTimer = null;
function save() {
  if (!P) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    localStorage.setItem(LS_P(P.id), JSON.stringify(P));
    const ix = loadIndex(); const e = ix.find(x => x.id === P.id);
    if (e) { e.updatedAt = Date.now(); e.name = P.name; saveIndex(ix); }
  }, 350);
}

/* ══════════ 이미지 ══════════ */
async function setImageFromBlob(blob, persist = true) {
  await new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { img = im; res(); }; im.onerror = rej;
    im.src = URL.createObjectURL(blob);
  });
  $('baseImg').src = img.src;
  P.imgW = img.naturalWidth; P.imgH = img.naturalHeight;
  if (persist) { await idbPut(P.id, blob); save(); }
}
async function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  if (!P) { newProject(); if (!P) return; }
  setSb('이미지 처리 중…');
  const blob = await downscale(file, 2400);
  await setImageFromBlob(blob);
  renderAll();
  setSb('드래그 = 가리기 · 흰 칸 클릭 = 되살리기 · [+숫자]로 표식');
}
function downscale(file, maxSide) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, maxSide / Math.max(im.naturalWidth, im.naturalHeight));
      if (s >= 1) { res(file); return; }
      const c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || file), 'image/png');
    };
    im.onerror = () => res(file);
    im.src = URL.createObjectURL(file);
  });
}

/* ══════════ 되돌리기 ══════════ */
function snap() {
  if (!P) return;
  undoStack.push(JSON.stringify({ masks: P.masks, marks: P.marks }));
  if (undoStack.length > 50) undoStack.shift();
}
function undo() {
  if (!undoStack.length) { setSb('되돌릴 게 없습니다'); return; }
  const s = JSON.parse(undoStack.pop());
  P.masks = s.masks; P.marks = s.marks;
  save(); renderAll(); setSb('되돌림');
}

/* ══════════ 렌더 ══════════ */
function renderAll() {
  const has = !!(P && img);
  $('stage').style.display = has ? 'inline-block' : 'none';
  $('emptyBox').style.display = has ? 'none' : 'block';
  if (!has) { $('layer').innerHTML = ''; return; }
  const wpx = $('baseImg').clientWidth || 1;
  $('layer').innerHTML =
    P.masks.map((m, i) =>
      `<div class="mask" data-t="k" data-i="${i}"
        style="left:${m.x*100}%;top:${m.y*100}%;width:${m.w*100}%;height:${m.h*100}%"></div>`).join('') +
    P.marks.map((m, i) =>
      `<div class="mark${i === selMark ? ' sel' : ''}" data-t="m" data-i="${i}"
        style="left:${m.x*100}%;top:${m.y*100}%;font-size:${Math.max(9,(P.fs||DEF_FS)*wpx)}px">+${m.n}</div>`).join('');
}
window.addEventListener('resize', () => { if (P && img) renderAll(); });

/* ══════════ 숫자 표식 배치 ══════════ */
function startPlace() {
  if (!img) { setSb('이미지 먼저'); return; }
  placing = !placing;
  $('btnMark').classList.toggle('on', placing);
  document.body.classList.toggle('placing', placing);
  setSb(placing ? '숫자를 놓을 위치를 클릭하세요' : '취소');
}
function endPlace() {
  placing = false; $('btnMark').classList.remove('on'); document.body.classList.remove('placing');
}

/* ══════════ 포인터 ══════════ */
const layer = $('layer');
let drag = null, lpTimer = null;

const rectOf = () => $('baseImg').getBoundingClientRect();
function toN(e) { const r = rectOf(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; }

layer.addEventListener('pointerdown', e => {
  if (!P || !img) return;
  const el = e.target.closest('[data-t]');
  const p = toN(e);
  try { layer.setPointerCapture(e.pointerId); } catch {}

  if (el && el.dataset.t === 'm') {                 // 숫자 표식: 이동 or 값 수정
    const i = +el.dataset.i;
    drag = { type: 'mark', i, sx: e.clientX, sy: e.clientY, o: { ...P.marks[i] }, moved: false };
    return;
  }
  if (el && el.dataset.t === 'k') {                 // 흰 박스: 클릭 = 삭제
    drag = { type: 'mask', i: +el.dataset.i, sx: e.clientX, sy: e.clientY, moved: false };
    return;
  }
  if (placing) { drag = { type: 'place', px: p.x, py: p.y }; return; }

  if (selMark !== null) { selMark = null; renderAll(); }   // 빈 곳 클릭 = 선택 해제
  // 빈 곳: 드래그해야만 새 박스 생성 (클릭만으로는 아무 일도 없음)
  drag = { type: 'draw', sx: e.clientX, sy: e.clientY, nx: p.x, ny: p.y, cx: p.x, cy: p.y, moved: false, touch: e.pointerType === 'touch', armed: e.pointerType !== 'touch' };
  if (drag.touch) lpTimer = setTimeout(() => { if (drag) { drag.armed = true; setSb('영역을 드래그하세요'); } }, 380);
});

layer.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - (drag.sx || 0), dy = e.clientY - (drag.sy || 0);
  const far = Math.hypot(dx, dy) > CLICK_PX;

  if (drag.type === 'mark') {
    if (!far) return;
    if (!drag.moved) snap();
    drag.moved = true;
    const r = rectOf();
    P.marks[drag.i].x = clamp01(drag.o.x + dx / r.width);
    P.marks[drag.i].y = clamp01(drag.o.y + dy / r.height);
    renderAll(); return;
  }
  if (drag.type === 'mask') { if (far) drag.moved = true; return; }
  if (drag.type === 'draw') {
    if (far) drag.moved = true;
    if (!drag.armed) { if (far && lpTimer) { clearTimeout(lpTimer); lpTimer = null; drag = null; } return; }
    const p = toN(e); drag.cx = p.x; drag.cy = p.y;
    showRubber(drag.nx, drag.ny, p.x, p.y);
  }
});

layer.addEventListener('pointerup', e => {
  if (lpTimer) { clearTimeout(lpTimer); lpTimer = null; }
  if (!drag) return;
  hideRubber();
  const d = drag; drag = null;

  if (d.type === 'mark') {
    if (d.moved) { save(); setSb('숫자 이동'); }
    else { selMark = d.i; renderAll(); setSb('선택됨 · Delete 삭제 · 더블클릭 값 변경'); }
    return;
  }
  if (d.type === 'mask') {
    if (!d.moved) { snap(); P.masks.splice(d.i, 1); save(); renderAll(); setSb('되살림'); }
    return;
  }
  if (d.type === 'place') { addMark(d.px, d.py); return; }

  if (d.type === 'draw') {
    const x = Math.min(d.nx, d.cx), y = Math.min(d.ny, d.cy);
    const w = Math.abs(d.cx - d.nx), h = Math.abs(d.cy - d.ny);
    snap();
    if (!(d.moved && w > 0.008 && h > 0.008)) { undoStack.pop(); return; }   // 그냥 클릭이면 아무것도 안 함
    P.masks.push({ x, y, w, h });
    P.lastSize = { w, h };
    setSb('가림 (다시 클릭하면 되살아납니다)');
    save(); renderAll();
  }
});
layer.addEventListener('pointercancel', () => { hideRubber(); drag = null; if (lpTimer) clearTimeout(lpTimer); });

function addMark(x, y) {
  const v = prompt('숫자 (예: 2)', '2');
  endPlace();
  if (v === null) return;
  const n = Math.max(0, Math.min(99, parseInt(v, 10) || 0));
  if (!n) return;
  snap(); P.marks.push({ x, y, n }); selMark = P.marks.length - 1;
  save(); renderAll(); setSb(`+${n} 추가 · 끌어서 위치 조정`);
}
function editMark(i) {
  const m = P.marks[i]; if (!m) return;
  const v = prompt('숫자 (0 또는 빈칸이면 삭제)', m.n);
  if (v === null) return;
  const n = Math.max(0, Math.min(99, parseInt(v, 10) || 0));
  snap();
  if (!n) { P.marks.splice(i, 1); selMark = null; setSb('숫자 삭제'); }
  else { m.n = n; setSb(`+${n}`); }
  save(); renderAll();
}
function deleteMark(i) {
  if (i === null || !P.marks[i]) return;
  snap(); P.marks.splice(i, 1); selMark = null;
  save(); renderAll(); setSb('숫자 삭제');
}
/* 숫자 전체 크기 조절 */
function scaleMarks(f) {
  if (!P) return;
  P.fs = Math.max(0.008, Math.min(0.2, (P.fs || DEF_FS) * f));
  save(); renderAll();
  setSb('숫자 크기 ' + Math.round(P.fs * 1000) / 10 + '%');
}

function showRubber(x0, y0, x1, y1) {
  const r = rectOf(), st = $('stage').getBoundingClientRect(), el = $('rubber');
  const x = Math.min(x0, x1), y = Math.min(y0, y1), w = Math.abs(x1 - x0), h = Math.abs(y1 - y0);
  el.style.display = 'block';
  el.style.left = (r.left - st.left + x * r.width) + 'px';
  el.style.top = (r.top - st.top + y * r.height) + 'px';
  el.style.width = (w * r.width) + 'px';
  el.style.height = (h * r.height) + 'px';
}
const hideRubber = () => $('rubber').style.display = 'none';

/* ══════════ 키보드 / 메뉴 ══════════ */
document.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (e.key === 'Escape') { if (placing) endPlace(); if (selMark !== null) { selMark = null; renderAll(); } return; }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selMark !== null) { e.preventDefault(); deleteMark(selMark); }
});
/* 숫자 더블클릭 = 값 변경 */
layer.addEventListener('dblclick', e => {
  const el = e.target.closest('[data-t="m"]'); if (!el) return;
  e.preventDefault(); editMark(+el.dataset.i);
});
function toggleMenu(e) { e.stopPropagation(); $('menu').classList.toggle('open'); }
const closeMenu = () => $('menu').classList.remove('open');
document.addEventListener('click', e => { if (!e.target.closest('.menu') && !e.target.closest('.topbar .btn')) closeMenu(); });

/* ══════════ 입력 ══════════ */
$('imgIn').addEventListener('change', e => { if (e.target.files[0]) handleFile(e.target.files[0]); e.target.value = ''; });
document.addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (it) handleFile(it.getAsFile());
});
['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $('drop')?.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); $('drop')?.classList.remove('over'); }));
document.addEventListener('drop', e => { const f = e.dataTransfer?.files?.[0]; if (f) handleFile(f); });

/* ══════════ 내보내기 ══════════ */
function exportPNG() {
  if (!P || !img) { setSb('이미지 없음'); return; }
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0);
  x.fillStyle = '#ffffff';
  for (const m of P.masks)
    x.fillRect(m.x * c.width, m.y * c.height, m.w * c.width, m.h * c.height);
  for (const m of P.marks) {
    const fs = Math.max(10, (P.fs || DEF_FS) * c.width);
    x.font = `800 ${fs}px system-ui,'Noto Sans KR',sans-serif`;
    const t = '+' + m.n, tw = x.measureText(t).width, pad = fs * 0.3;
    const bw = tw + pad * 2, bh = fs * 1.15 + pad * 0.5;
    const bx = m.x * c.width - bw / 2, by = m.y * c.height - bh / 2;
    x.fillStyle = '#e02020'; x.fillRect(bx, by, bw, bh);
    x.fillStyle = '#fff'; x.textBaseline = 'middle'; x.textAlign = 'center';
    x.fillText(t, bx + bw / 2, by + bh / 2 + fs * 0.03);
  }
  const a = document.createElement('a');
  a.download = (P.name || '공구').replace(/[^\w가-힣\s-]/g, '').trim().replace(/\s+/g, '_') + '_잔여.png';
  a.href = c.toDataURL('image/png'); a.click();
  setSb('PNG 저장 완료 ✓');
}
async function exportJSON() {
  if (!P) return;
  const blob = await idbGet(P.id);
  const dataURL = blob ? await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(blob); }) : null;
  const a = document.createElement('a');
  a.download = (P.name || '공구').replace(/\s+/g, '_') + '.json';
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'fgogoods', version: 2, project: P, image: dataURL })], { type: 'application/json' }));
  a.click(); setSb('백업 저장 완료');
}
$('jsonIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (o.app !== 'fgogoods') throw new Error('형식이 다릅니다');
    const id = 'g' + Date.now().toString(36);
    P = migrate(Object.assign({}, o.project, { id }));
    const ix = loadIndex(); ix.unshift({ id, name: P.name, updatedAt: Date.now() }); saveIndex(ix);
    if (o.image) await setImageFromBlob(await (await fetch(o.image)).blob()); else img = null;
    undoStack = []; save(); renderProjSel(); renderAll(); setSb('백업 불러오기 완료');
  } catch (err) { setSb('불러오기 실패: ' + err.message); }
});

/* ══════════ 시작 ══════════ */
(async function init() {
  renderProjSel();
  const ix = loadIndex();
  if (ix.length) await openProject(ix[0].id);
  else setSb('[+ 새 공구]로 시작하세요');
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
})();
</script>
